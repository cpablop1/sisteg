<div id="form_agregar" hidden>
    <div class="border rounded shadow-lg p-5 mt-5">
        <form id="form_mantenimiento">
            {% csrf_token %}
            <div class="row">
                <div class="col-12 col-md-3 text-center">
                    <label for="cliente_id" class="form-label">Cliente:</label>
                    <div class="d-flex justify-content-center align-items-center">
                        <select name="cliente_id" id="cliente_id" class="form-select" style="width: 100%;"></select>
                        <i class="fa-solid fa-square-plus btn btn-primary btn-lg" id="agregar_cliente"></i>
                    </div>
                </div>
                <div class="col-12 col-md-3 text-center">
                    <label for="tipo_pago_id" class="form-label">Tipo de pago:</label>
                    <select name="tipo_pago_id" id="tipo_pago_id" class="form-select"></select>
                </div>
                <div class="col-12 col-md-3 text-center">
                    <label for="tipo_servicio_id" class="form-label">Tipo de servicio:</label>
                    <select name="tipo_servicio_id" id="tipo_servicio_id" class="form-select"></select>
                </div>
                <div class="col-12 col-md-3 text-center">
                    <label for="rol_usuario_id" class="form-label">Técnico asignado:</label>
                    <select name="rol_usuario_id" id="rol_usuario_id" class="form-select"></select>
                </div>
            </div>
            <div class="row my-2">
                <div class="col-12 col-md-12">
                    <p id="telefono"></p>
                </div>
            </div>
            <div class="row my-2">
                <div class="col-12 col-md-12">
                    <label for="nota" class="form-label">Nota del técnico:</label>
                    <textarea class="form-control" rows="3" name="nota" id="nota"
                        placeholder="Área donde se visualiza las observaciones del técnico" readonly></textarea>
                </div>
            </div>

            <div class="row my-2">
                <div class="col-12 col-md-12">
                    <!-- <label for="observacion" class="form-label">Descripción incial:</label>
                    <textarea class="form-control" rows="3" name="observacion" id="observacion"
                        placeholder="Describe el trabajo de mantenimiento a realizar (Obligatorio)"></textarea> -->
                    <div class="form-group">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="observacion" class="mb-0">
                                Descripción inicial:
                            </label>

                            <button type="button" class="btn btn-info btn-sm" id="btnAnalizarIa"
                                data-url="{% url 'analizar_description_ia' %}">
                                <i class="fas fa-wand-magic-sparkles"></i>
                                Analizar con IA
                            </button>
                        </div>

                        <textarea class="form-control" id="observacion" name="observacion" rows="4" maxlength="2000"
                            placeholder="Describa detalladamente el problema reportado por el cliente..."></textarea>

                        <div class="d-flex justify-content-between mt-1">
                            <small class="text-muted">
                                Incluya síntomas, tiempo del problema y comportamiento del equipo.
                            </small>

                            <small class="text-muted">
                                <span id="contadorDescripcion">0</span>/2000
                            </small>
                        </div>
                    </div>

                </div>
            </div>

            <div class="row my-2">
                <div class="col-12 col-md-12">
                    <div id="mensajeAnalisisIa" class="mt-3 d-none" role="alert"></div>
                </div>
            </div>

            <div class="row my-2">
                <div class="col-12 col-md-12">
                    <div class="card border-info mt-3 d-none" id="panelAnalisisIa">
                        <div class="card-header bg-info text-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fas fa-robot mr-1"></i>
                                    <strong>Análisis preliminar generado por IA</strong>
                                </div>

                                <button type="button" class="btn btn-light btn-sm close" id="btnCerrarAnalisisIa"
                                    aria-label="Cerrar">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        </div>

                        <div class="card-body">

                            <div class="mb-3">
                                <h6 class="font-weight-bold mb-1">
                                    Resumen del problema
                                </h6>

                                <p class="mb-0 text-justify" id="iaResumen"></p>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <h6 class="font-weight-bold mb-1">
                                        Categoría
                                    </h6>

                                    <span class="badge bg-primary p-2" id="iaCategoria"></span>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <h6 class="font-weight-bold mb-1">
                                        Subcategoría
                                    </h6>

                                    <span class="badge bg-secondary p-2" id="iaSubcategoria"></span>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <h6 class="font-weight-bold mb-1">
                                        Prioridad sugerida
                                    </h6>

                                    <span class="badge bg-secondary p-2" id="iaPrioridad"></span>
                                </div>
                            </div>

                            <hr>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <h6 class="font-weight-bold">
                                        <i class="fas fa-search mr-1"></i>
                                        Posibles causas preliminares
                                    </h6>

                                    <ul class="pl-4 mb-0" id="iaPosiblesCausas"></ul>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <h6 class="font-weight-bold">
                                        <i class="fas fa-question-circle mr-1"></i>
                                        Preguntas sugeridas para el cliente
                                    </h6>

                                    <ul class="pl-4 mb-0" id="iaPreguntasSugeridas"></ul>
                                </div>
                            </div>

                            <div class="alert alert-warning mb-0" id="iaAdvertencia"></div>
                        </div>

                        <div class="card-footer text-right">
                            <button type="button" class="btn btn-outline-danger btn-sm" id="btnDescartarAnalisisIa">
                                <i class="fas fa-trash-alt"></i>
                                Descartar análisis
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row my-2">
                <div class="col-12 col-md-6 d-flex justify-content-end align-items-center">
                    <div>
                        <label for="subtotal" class="form-label text-center">Subtotal del servicio:</label>
                        <h4 class="bg-light p-2 text-center" id="subtotal">Q. 00</h3>
                    </div>
                </div>
                <div class="col-12 col-md-6 d-flex justify-content-end align-items-center">
                    <div>
                        <label for="ganancia" class="form-label text-center">Ganancia:</label>
                        <h4 class="bg-success text-white p-2 text-center" id="ganancia">Q. 00</h3>
                    </div>
                </div>
            </div>

            <div class="mb-3 d-flex justify-content-end">
                <button type="button" class="btn btn-primary mx-2" id="crear_servicio"><i
                        class="fa-solid fa-square-check"></i>
                    Crear Mantenimiento</button>
                <button type="button" class="btn btn-primary mx-2" id="actualizar_servicio" hidden><i
                        class="fa-solid fa-square-check"></i>
                    Actualizar Mantenimiento</button>
                <button type="button" class="btn btn-secondary" id="eliminar_servicio"><i class="fa-solid fa-trash"></i>
                    Vaciar</button>
            </div>
        </form>
    </div>
</div>
